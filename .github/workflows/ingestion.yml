name: Check official data updates
on:
  schedule: [{cron: "17 1 * * *"}]
  workflow_dispatch:
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ETL
        run: docker compose build etl-worker
      - name: Check and validate
        run: docker compose run --rm etl-worker python -m etl validate
      - name: Preserve reports
        uses: actions/upload-artifact@v4
        with: {name: ingestion-reports, path: data/reports/}

